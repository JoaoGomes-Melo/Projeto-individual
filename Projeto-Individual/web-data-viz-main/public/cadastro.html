      <section class="banner">

          <div class="container">
            <div class="fundo">
              <div class="formulario">
                <div class="linha">
                  <div class="campo">
                    <span>Nome</span>
                    <input id="nome_input" type="text" placeholder="João">
                  </div>
                  <div class="campo">
                    <span>Apelido</span>
                    <input id="apelido_input" type="text" placeholder="Jotta">
                  </div>
                </div>
                <div class="campo">
                  <span>E-mail</span>
                  <input id="email_input" type="text" placeholder="email@gmail.com">
                </div>
                <div class="linha">
                  <div class="campo">
                    <span>Sexo</span>
                    <select id="sexo_select">
                      <option selected disabled value="#">Selecione uma opção</option>
                      <option value="M">Masculino</option>
                      <option value="F">Feminino</option>
                    </select>
                  </div>
                  <div class="campo">
                    <span>Data de Nascimento</span>
                    <input id="idade_input" type="date">

                  <input id="confirmacao_senha_input" type="password" placeholder="******">
                  <p>ja possui cadastro: <a href="login.html">Clique aqui!</a></p>
                </div>

                <div class="card_erro" id="cardErro" style="display: none;">
                  <span id="mensagem_erro"></span>
                </div>

                <button class="botao" onclick="cadastrar()">Cadastrar</button>
              </div>
            </div>
          </div>
      </section>
    </main>
    <div id="div_aguardar" class="loading-div" style="display: none;">

    <div id="div_erros_login"></div>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var apelidoVar = apelido_input.value;
    var sexoVar = sexo_select.value;
    var idadeVar = idade_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;


    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      apelidoVar == "" ||
      sexoVar == "" ||
      idadeVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Preencha todos os campos)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // // Verificando se o código de ativação é de alguma empresa cadastrada
    // for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
    //   if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
    //     idEmpresaVincular = listaEmpresasCadastradas[i].id
    //     console.log("Código de ativação válido.");
    //     break;
    //   } else {
    //     cardErro.style.display = "block";
    //     mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
    //     finalizarAguardar();
    //   }
    // }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        apelidoServer : apelidoVar,
        sexoServer : sexoVar,
        idadeServer : idadeVar,
        
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        // finalizarAguardar();
      });

    return false;
  }
