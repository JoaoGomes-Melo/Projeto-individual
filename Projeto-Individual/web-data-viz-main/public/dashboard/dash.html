<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/dashboards.css">
    <link rel="icon" href="../assets/imgs/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Dashborad</title>
</head>

<body onload="carregarDash()">
    <header>

        <div class="nav-bar">
            <div class="img-logo">
                <img src="../assets/imgs/logo-texto.png" href="index.html">
            </div>
            <div class="links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../jogo1.html">Jogo</a></li>
            </div>
        </div>
    </header>
    <div class="container">

        <div class="graficos">
            <div class="grafico">
                <canvas id="graficoIdade"></canvas>
            </div>

            <div class="grafico2">
                <canvas id="graficoSexo"></canvas>
            </div>
        </div>

        <div class="kpis">
            <div class="kpi1">
                <span>Sua Pontuação</span>
                <h1 id="pontuacao"></h1>
            </div>
            <div class="kpi2">
                <span>Pontuação perdida</span>
                <h1 id="h1totalErros"></h1>
            </div>
            <div class="kpi3">
                <span>Respostas erradas</span>
                <h1 id="h1pontuacaoPerdida"></h1>
            </div>
        </div>

    </div>

</body>


<script>

    function carregarDash() {
        var id_usuario = sessionStorage.ID_USUARIO;
        graficoTotal();
        graficoSexo();

        fetch(`/jogo/buscarDados/${id_usuario}`, {

        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    pontuacaoTotal = json.pontuacao;
                    totalErros = json.erros;
                    pontuacaoPerdida = json.qtdErros;

                    pontuacao.innerHTML = `${pontuacaoTotal}`;
                    h1totalErros.innerHTML = `${totalErros}`;
                    h1pontuacaoPerdida.innerHTML = `${pontuacaoPerdida}`;
                });

            } else {

                console.log("Houve um erro ao tentar realizar a busca!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }
        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    var totalVelhos;
    var totalNovos;
    var porcHomem;
    var porcMulher;
    async function graficoTotal() {
        const res = await fetch("/jogo/pontuacaoVelhos");
        const res2 = await fetch("/jogo/pontuacaoNovos");

        if (res.status === 200 && res2.status === 200) {
            totalVelhos = await res.json();
            totalNovos = await res2.json();
            montaGrafico(totalNovos, totalVelhos);
        }
    }

    async function graficoSexo() {
        const res1 = await fetch("/jogo/porcentagemHomem");
        const res2 = await fetch("/jogo/porcentagemMulher");
        if (res1.status === 200 && res2.status === 200) {
            porcHomem = await res1.json();
            porcMulher = await res2.json();
            montaGraficoSexo(porcHomem, porcMulher);
        }
    }


    function montaGrafico(response, response2) {
        const idade = document.getElementById('graficoIdade');
        const sexo = document.getElementById('graficoSexo');

        new Chart(idade, {
            type: 'bar',
            data: {
                labels: ["Pontuação Dos jogadores entre os mais novos e os mais velhos"],
                datasets: [
                    {
                        label: 'Mais Novos',
                        data: [response[0].total],
                        backgroundColor: '#4a0072'
                    },
                    {
                        label: 'Mais Velhos',
                        data: [response2[0].total],
                        backgroundColor: '#ffa726',
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            color: '#fff',
                            font: {
                                size: 16 //
                            }
                        }
                    },
                    x: {
                        ticks: {
                            color: '#fff',
                            align: 'center',
                            textAlign: 'center',
                            font: {
                                size: 16 //
                            }
                        }
                    }
                },
                plugins: {
                    legend: {
                        labels: {
                            color: '#fff',
                            font: {
                                size: 18 // 
                            }
                        }
                    }
                }
            }
        });
    }
    function montaGraficoSexo(response1, response2) {
        const sexo = document.getElementById('graficoSexo');
        new Chart(sexo, {
            type: 'pie',
            data: {
                labels: [
                    'Mulher',
                    'Homem'
                ],
                datasets: [{
                    label: 'Homem',
                    label: 'Mulher',
                    data: [response2[0].mulher, response1[0].homem],
                    backgroundColor: [
                        'rgb(255, 99, 132)',
                        'rgb(54, 162, 235)',
                        'rgb(255, 205, 86)'
                    ],
                    hoverOffset: 4
                }
                ]
            },
            options: {
                plugins: {
                    legend: {
                        labels: {
                            color: '#fff',
                            font: {
                                size: 18
                            }
                        }
                    }
                }
            }
        });
    }

</script>
