<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script/index.js"></script>
    <link rel="stylesheet" href="style/styleCadastro.css">
    <link rel="icon" href="img/logo.png">
    <title>Cadastro</title>
</head>

<body>
    <!-- Cabeçalho -->
    <header>

        <div class="nav-bar">
            <div class="img-logo">
                <img src="img/logo-texto.png">
            </div>
            <div class="links">
                <li><a href="index.html">Home</a></li>
                <li><a href="#personagens-section">Personagens</a></li>
                <li><a href="#curiosidades-section">Curiosidades</a></li>
                <!-- <li><a href="#sobre-section">Sobre</a></li> -->
            </div>
            <div class="botoes">
                <a href="login.html"><button onclick="Btnlogin()" class="btn-login">Login</button></a>
                <a href="cadastro.html"> <button onclick="Btncadastro()" class="btn-cadastro">Cadastro</button></a>
            </div>
            <!-- Menu responsividade -->
            <div class="container-menu">
                <div class="menu"></div>
                <div class="menu"></div>
                <div class="menu"></div>
            </div>
        </div>
    </header>
    <main>
        <section class="banner">
            <div class="container">
                <div class="fundo">
                    <div class="formulario">
                        <div class="linha">
                            <div class="campo">
                                <span>Nome</span>
                                <input id="nome_input" type="text" placeholder="João">
                            </div>
                            <div class="campo">
                                <span>Apelido</span>
                                <input id="apelido_input" type="text" placeholder="Jotta">
                            </div>
                        </div>
                        <div class="campo">
                            <span>E-mail</span>
                            <input id="email_input" type="text" placeholder="email@gmail.com">
                        </div>
                        <div class="linha">
                            <div class="campo">
                                <span>Sexo</span>
                                <select>
                                    <option selected disabled value="#">Selecione uma opção</option>
                                    <option value="M">Masculino</option>
                                    <option value="F">Feminino</option>
                                </select>
                            </div>
                            <div class="campo">
                                <span>Data de Nascimento</span>
                                <input id="idade_input" type="date" >
                            </div>
                        </div>
                        <div class="campo">
                            <span>Senha</span>
                            <input id="senha_input" type="password" placeholder="******">
                        </div>
                        <div class="campo">
                            <span>Repetir senha</span>
                            <input id="repetir_senha_input" type="password" placeholder="******">
                            <p>ja possui cadastro: <a href="login.html">Clique aqui!</a></p>
                        </div>

                        <button class="botao" onclick="cadastrar()">Cadastrar</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>
